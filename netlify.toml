[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.75.1"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "index.xml"
  [headers.values]
    Content-Type = "application/rss+xml"

# Resources section: the TAI scale entry points to the existing page /tai-scale/.
# The compact list view also links its summary to the entry's own page; forward it.
[[redirects]]
  from = "/resource/tai-scale/"
  to = "/tai-scale/"
  status = 301
  force = true

# Former URL of the TAI entry (before resources got their own content type).
[[redirects]]
  from = "/project/tai-scale/"
  to = "/tai-scale/"
  status = 301
  force = true
